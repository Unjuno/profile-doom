<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>profile-doom</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #010409;
      color: #f0f6fc;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    main { width: min(94vw, 760px); }
    .box {
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      overflow: hidden;
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid #21262d;
      font-size: 14px;
      font-weight: 600;
    }
    .screen { padding: 16px; }
    img { display: block; width: 100%; height: auto; }
    .status { margin-top: 12px; }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px 16px;
      color: #8b949e;
      font-size: 12px;
      border-top: 1px solid #21262d;
    }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <section class="box">
      <header>Unjuno / profile-doom</header>
      <div class="screen">
        <img src="./doom.gif" alt="Live rendered Freedoom session">
        <div class="status"><img src="./status.svg" alt="Shared game status"></div>
      </div>
      <footer>
        <span>Rendered by GitHub Actions.</span>
        <a href="https://github.com/Unjuno/profile-doom/issues/1">Controller →</a>
      </footer>
    </section>
  </main>
</body>
</html>
