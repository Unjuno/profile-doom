name: Profile status tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/render_status.py'
      - 'tests/**'
      - '.github/workflows/profile-status-tests.yml'
  pull_request:
    paths:
      - 'scripts/render_status.py'
      - 'tests/**'
      - '.github/workflows/profile-status-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run status regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify export against the repository checkpoint
        run: |
          python3 scripts/render_status.py --output "$RUNNER_TEMP/profile-status"
          test -s "$RUNNER_TEMP/profile-status/status-v2-light.svg"
          test -s "$RUNNER_TEMP/profile-status/status-v2-dark.svg"
