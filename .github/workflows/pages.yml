name: Render and deploy profile-doom

on:
  push:
    branches: [main]
    paths-ignore:
      - "state/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install DOOM runtime and capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            chocolate-doom \
            freedoom \
            xvfb \
            xdotool \
            x11-utils \
            ffmpeg \
            python3-pil

      - name: Render current game state
        run: bash scripts/capture_doom.sh

      - name: Render status card
        run: python3 scripts/render_status.py

      - name: Verify generated assets
        run: |
          test -s site/doom.gif
          test -s site/status.svg
          file site/doom.gif
          du -h site/doom.gif

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
